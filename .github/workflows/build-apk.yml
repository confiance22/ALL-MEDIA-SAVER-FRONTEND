name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=BACKEND_URL=https://media-saver-backend.fly.dev

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-media-saver-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: All Media Saver Android
          body: Latest Android APK, built from main with the production backend baked in.
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
